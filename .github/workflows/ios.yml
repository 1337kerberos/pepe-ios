# Builds an UNSIGNED .ipa of PepePiP on a GitHub-hosted macOS runner (free on public repos) for sideloading from Linux.
name: ios

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      widget:
        description: "include the PepeWidget Live Activity extension (second App ID; install with iLoader, not LiveContainer)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-14          # if GitHub retires macos-14, change to macos-15 (same steps)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner (MTKView-in-PiP needs the iOS 18 SDK = Xcode 16+)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $XC"; sudo xcode-select -s "$XC"
          xcodebuild -version; swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          SPEC=project-widget.yml          # default since 0.9: app + Live Activity extension
          if [ "${{ github.event.inputs.widget }}" = "false" ]; then SPEC=project.yml; fi
          echo "spec: $SPEC"
          xcodegen generate --spec "$SPEC"
          ls

      - name: Resolve Swift packages (GLTFKit2 binary xcframework)
        run: xcodebuild -resolvePackageDependencies -project PepePiP.xcodeproj -scheme PepePiP

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project PepePiP.xcodeproj -scheme PepePiP -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PepePiP.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" \
            2>&1 | tee build/xcodebuild.log | grep -E --line-buffered "error:|warning: .*(deprecated|unused)|\*\* .* \*\*|Compiling|Linking|Archive" || true
          grep -q "ARCHIVE SUCCEEDED" build/xcodebuild.log || { echo "::error::archive failed; see the xcodebuild-log artifact"; grep -E "error:" build/xcodebuild.log | head -40; exit 1; }

      - name: Package Payload/*.app into an .ipa
        run: |
          APP=$(ls -d build/PepePiP.xcarchive/Products/Applications/*.app | head -1)
          echo "app: $APP"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qr PepePiP-unsigned.ipa Payload)
          ls -la build/PepePiP-unsigned.ipa
          # what's inside (frameworks must be present for the signer to re-sign them)
          unzip -l build/PepePiP-unsigned.ipa | grep -E "Frameworks/|pepe.glb|nebula_720.mp4|Info.plist|PlugIns" || true

      - uses: actions/upload-artifact@v4
        with:
          name: PepePiP-unsigned-ipa-${{ github.event.inputs.widget == 'false' && 'app-only' || 'with-widget' }}
          path: build/PepePiP-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
