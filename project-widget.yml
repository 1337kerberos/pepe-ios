# Same as project.yml plus the PepeWidget extension (Live Activity / Dynamic Island). Needs a second App ID when signing
# (lab.pepe.pip.widget); Sideloader with a free Apple ID allows 10 App IDs per 7 days. Build with the `widget` input.
name: PepePiP
options:
  bundleIdPrefix: lab.pepe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.15
targets:
  PepePiP:
    type: application
    platform: iOS
    sources:
      - path: PepePiP
      - path: Shared
      - path: Assets/pepe.glb
        buildPhase: resources
      - path: Assets/nebula_720.mp4      # 0.14 nebula loop (looked up through AppResources, LiveContainer-safe)
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
      - target: PepeWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.pepe.pip
        INFOPLIST_FILE: PepePiP/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.14"
        CURRENT_PROJECT_VERSION: "19"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
  PepeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PepeWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.pepe.pip.widget
        INFOPLIST_FILE: PepeWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.14"
        CURRENT_PROJECT_VERSION: "19"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
