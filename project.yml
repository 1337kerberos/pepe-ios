# XcodeGen spec (the CI runs `xcodegen generate` so no hand-written .pbxproj is needed). App target only.
# For the Live Activity widget extension use project-widget.yml instead (second App ID; see README).
name: PepePiP
options:
  bundleIdPrefix: lab.pepe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"            # language mode 5 under the Swift 5.10 / 6 toolchain
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.15
targets:
  PepePiP:
    type: application
    platform: iOS
    sources:
      - path: PepePiP
      - path: Shared
      - path: Assets/pepe.glb
        buildPhase: resources
      - path: Assets/puff.png
        buildPhase: resources
      - path: Assets/glow.png
        buildPhase: resources
      - path: Assets/floor_shadow.png
        buildPhase: resources
      - path: Assets/bg_lounge.png
        buildPhase: resources
      - path: Assets/bg_office.png
        buildPhase: resources
      - path: Assets/bg_neon.png
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.pepe.pip
        INFOPLIST_FILE: PepePiP/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.4"
        CURRENT_PROJECT_VERSION: "4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
